{% extends "base.html" %}

{% block title %}Login - Mess Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-box-arrow-in-right text-primary"></i> Login
                </h2>
                <p class="text-muted text-center mb-4">Choose your account type to open the correct panel.</p>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">Sign in as</legend>
                        <div class="d-flex gap-2 role-selector" role="group" aria-label="Choose account type">
                            <input type="radio" class="btn-check" name="role" id="role-admin" value="admin" autocomplete="off" required {{ 'checked' if selected_role == 'admin' else '' }}>
                            <label class="btn btn-outline-primary flex-fill" for="role-admin">
                                <i class="bi bi-shield-lock"></i> Admin
                            </label>
                            <input type="radio" class="btn-check" name="role" id="role-staff" value="staff" autocomplete="off" {{ 'checked' if selected_role == 'staff' else '' }}>
                            <label class="btn btn-outline-primary flex-fill" for="role-staff">
                                <i class="bi bi-person-workspace"></i> Staff
                            </label>
                            <input type="radio" class="btn-check" name="role" id="role-student" value="student" autocomplete="off" {{ 'checked' if selected_role == 'student' else '' }}>
                            <label class="btn btn-outline-primary flex-fill" for="role-student">
                                <i class="bi bi-person"></i> Student
                            </label>
                        </div>
                        <div class="form-text">Choose the role assigned to your account.</div>
                    </fieldset>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </div>
                </form>
                <div class="text-center">
                    <p class="text-muted mb-0">Don't have a student account?
                        <a href="{{ url_for('auth.register') }}">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
